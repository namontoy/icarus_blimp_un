# Settings for `idf.py monitor` (esp-idf-monitor). idf.py runs the monitor
# with this project folder as its working directory, which is the first place
# the monitor looks for this file, so it applies to everyone who builds here.
#
# Why: the default exit key is Ctrl+], and on Spanish and Latin American
# keyboards ']' sits behind AltGr, so Ctrl+] usually sends nothing the monitor
# recognises. Ctrl+C can't be the exit either: the monitor deliberately
# forwards it to the chip. Ctrl+X is free on every layout and the console
# (linenoise) has no use for it.
#
# The menu route also still exits: Ctrl+T, then a plain 'x'. (Ctrl+T then
# Ctrl+X no longer does: the monitor sends its own exit key through verbatim
# when it follows the menu key.)

[esp-idf-monitor]
exit_key = X
